# Email Agent — runtime configuration
#
# This file is NOT read by the application.
# Copy it as a reference for the environment variables and CLI flags
# that control how the daemon starts.
#
# Application settings (Telegram, notification thresholds, etc.) are stored in
# the encrypted database. See docs/settings.md.
#
# Email accounts are managed separately with the `account` subcommands and may
# number more than one (each polled independently):
#
#   email-agent account add           # add an account
#   email-agent account list          # list configured accounts
#   email-agent account disable <id>  # stop polling one without removing it

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# Path to the encrypted SQLite database file.
# Resolution order:
#   1. --db flag:             email-agent --db /path/to/email-agent.db run
#   2. Environment variable:  EMAIL_AGENT_DB=/path/to/email-agent.db
#   3. Default:               ~/.email-agent/email-agent.db
#
# EMAIL_AGENT_DB=~/.email-agent/email-agent.db

# ---------------------------------------------------------------------------
# Encryption key
# ---------------------------------------------------------------------------

# Hex-encoded 32-byte AES key used to encrypt the database.
# Generated automatically by `email-agent init` and saved to the OS keychain.
# Set this variable on systems without a keychain (e.g. servers, CI):
#
# EMAIL_AGENT_KEY=<hex key printed by email-agent init>

# ---------------------------------------------------------------------------
# Log level override
# ---------------------------------------------------------------------------

# Overrides the log.level setting stored in the database without modifying it.
# Useful for temporary debug sessions.
#
# LOG_LEVEL=debug

# ---------------------------------------------------------------------------
# LLM classification (configured via email-agent init llm)
# ---------------------------------------------------------------------------

# All LLM settings are stored in the encrypted database, not here.
# Use the init wizard to set them:
#
#   email-agent init llm
#
# Available DB keys (see docs/settings.md for full reference):
#
#   llm.provider              = "anthropic" | "openai" | "" (disabled)
#   llm.anthropic.api_key     = <key>         ← stored encrypted
#   llm.openai.api_key        = <key>         ← stored encrypted
#   llm.model                 = <optional model override>
#   llm.score_divergence_warn = 30
#   content.mode              = "headers_only" | "redacted_body" | "full_body"
