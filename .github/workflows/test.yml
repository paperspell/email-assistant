name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  # Версия должна совпадать с GOLANGCI_LINT_VERSION в Makefile.
  GOLANGCI_LINT_VERSION: v2.10.1

jobs:
  golangci-lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # go-version-file вместо жёсткой версии: go.mod — единственный источник правды,
      # иначе при его бампе CI падает с "go.mod requires go >= X (GOTOOLCHAIN=local)".
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}

      # Скрипт берётся из тега, а не из master, и версия передаётся явно:
      # без неё ставился последний релиз, на котором ломалась проверка контрольной суммы.
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/${{ env.GOLANGCI_LINT_VERSION }}/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint --version
          golangci-lint run --verbose

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          make test

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migration tests
        run: |
          make test-migrations
