version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - lll
    - revive
    - staticcheck
    - unused
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - performance
        - style
        - opinionated
        - experimental
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - - ID
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    wrapcheck:
      ignore-sigs:
        - .New(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-sig-regexps:
        - \.New.*Error\(
      ignore-package-globs:
        - github.com/paperspell/*

  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gocritic
          - wrapcheck
        path: _test\.go
      - linters:
          - lll
        source: ^//go:generate
      - linters:
          - revive
        text: "avoid package names that conflict with Go standard library package names"
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/paperspell/email-assistant)
        - alias
        - blank
      custom-order: true
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
